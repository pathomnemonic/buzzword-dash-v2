name: Android app

# Builds the Android app from the same code as the website.
#  - Every run produces a debug APK you can install on a phone for testing.
#  - If the signing secrets below are set, it also produces a signed release
#    bundle (.aab) ready to upload to Google Play.
# It runs when Android files change, by hand (Actions tab -> "Android app" -> Run workflow),
# or when you push a tag like v1.0.0.

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.json'
      - 'js/native.js'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_BASE_PATH: /
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Build the web game and sync it into the Android project
        run: |
          npx vite build
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: buzzword-dash-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build signed release bundle
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload release bundle
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: buzzword-dash-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
