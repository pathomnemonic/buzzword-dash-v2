name: Keep Supabase awake

# Supabase's free plan pauses projects after about a week of no activity.
# This sends one small read request every 3 days so the project stays active.
# It uses the same public URL and anon key the website already exposes.

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY repository variables are not set; nothing to ping."
            exit 0
          fi
          # Tolerate a trailing slash or an accidental /rest/v1 suffix in the URL.
          SUPABASE_URL="${SUPABASE_URL%/}"
          SUPABASE_URL="${SUPABASE_URL%/rest/v1}"
          # New-style publishable keys (sb_publishable_...) are not JWTs and must
          # only be sent as the apikey header; legacy anon keys also work as Bearer.
          auth=()
          case "$SUPABASE_ANON_KEY" in
            sb_*) ;;
            *) auth=(-H "Authorization: Bearer $SUPABASE_ANON_KEY") ;;
          esac
          status=$(curl -s -o response.txt -w "%{http_code}"             -H "apikey: $SUPABASE_ANON_KEY" "${auth[@]}"             "$SUPABASE_URL/rest/v1/leaderboard_best?select=*&limit=1")
          echo "Supabase responded with HTTP $status"
          head -c 300 response.txt; echo
          if [ "$status" -ge 400 ]; then
            echo "::error::Supabase did not respond successfully (is the project paused?)"
            exit 1
          fi
