# Codemagic builds the iOS app in the cloud (no Mac needed) and sends it to TestFlight / App Store Connect.
# One-time setup is in docs/RELEASE_GUIDE.md (Part 2). This file has not been run yet: expect to fix a small
# thing or two on the first build, and read the log when a step fails.
workflows:
  ios-release:
    name: Dx Dash iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Dx Dash App Store Connect   # the name you give the API key in Codemagic (Teams > Integrations)
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.pathomnemonic.dxdash
      vars:
        VITE_BASE_PATH: /
        # Add VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY as secure variables in Codemagic (same values as on GitHub)
        # Add VITE_SUPPORT_EMAIL (where feedback emails go if the in-app form cannot reach the server)
        # Optional: VITE_AUTH_PROVIDERS (default google,apple,azure), VITE_IAP_VERIFY=1 once the iap-verify function is live (docs/PRO.md)
        # Add VITE_APPSTORE_ID (the numeric id from App Store Connect, once the app exists) so "Rate" can open the App Store page
    scripts:
      - name: Build the web game
        script: |
          npm ci
          npx vite build
      - name: Create the iOS project
        script: |
          npm i --no-save @capacitor/ios
          npx cap add ios
          npx cap sync ios
          npx capacitor-assets generate --ios
      - name: Orientations (iPhone upright, iPad any way), export compliance, email-link scheme, build number
        script: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" $PLIST
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" $PLIST
          # iPad: all four ways up, so it can be held and docked any way and passes Apple's iPad review
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad array" $PLIST
          i=0
          for o in UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight; do
            /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:$i string $o" $PLIST
            i=$((i+1))
          done
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" $PLIST || true
          # The email links (confirm account, reset password) reopen the app through this web-address-like scheme;
          # without it they do nothing on an iPhone (the same scheme is in the Android manifest and js/native.js)
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" $PLIST
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" $PLIST
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.pathomnemonic.dxdash" $PLIST
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" $PLIST
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string com.pathomnemonic.dxdash" $PLIST
          cd ios/App && agvtool new-version -all $BUILD_NUMBER
      - name: Privacy manifest (App Store requirement) and iPhone + iPad
        script: |
          # Apple wants a privacy manifest for the app itself; ios-config/PrivacyInfo.xcprivacy matches the App Privacy answers
          plutil -lint ios-config/PrivacyInfo.xcprivacy
          cp ios-config/PrivacyInfo.xcprivacy ios/App/App/PrivacyInfo.xcprivacy
          ruby -e '
            require "xcodeproj"
            proj = Xcodeproj::Project.open("ios/App/App.xcodeproj")
            target = proj.targets.find { |t| t.name == "App" }
            group = proj.main_group.find_subpath("App", true)
            ref = group.new_file("PrivacyInfo.xcprivacy")
            target.resources_build_phase.add_file_reference(ref, true)
            target.build_configurations.each { |c| c.build_settings["TARGETED_DEVICE_FAMILY"] = "1,2" }  # iPhone and iPad (the layout adapts; iPad screenshots are in assets/store/ipad)
            proj.save'
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build the signed app
        script: |
          xcode-project build-ipa --workspace "ios/App/App.xcworkspace" --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
